[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ani-it"
dynamic = ["version"]
description = "CLI/TUI nativo per lo streaming e download di anime da AnimeUnity in italiano"
readme = "README.md"
authors = [
    { name = "ani-it contributors" }
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
]
keywords = ["anime", "tui", "cli", "streaming", "mpv", "fzf", "animeunity", "archlinux"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]

[project.scripts]
ani-it = "ani_it.cli:main"

[tool.setuptools.dynamic]
# Unica fonte della versione: ani_it/_version.py (letto senza importare il pacchetto)
version = { attr = "ani_it._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["ani_it*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["build", "dist", "pkg", "src"]

[tool.ruff.lint]
# E/W: stile, F: pyflakes (import inutilizzati, variabili morte), B: bug probabili
select = ["E", "F", "W", "B"]
# Le righe lunghe (messaggi e stringhe ANSI) sono frequenti e volute
ignore = ["E501"]

[project.urls]
Homepage = "https://github.com/owaismounir206-art/ani-it"
Repository = "https://github.com/owaismounir206-art/ani-it"
Issues = "https://github.com/owaismounir206-art/ani-it/issues"
