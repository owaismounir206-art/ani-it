[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ani-it"
version = "1.0.0"
description = "CLI/TUI nativo per lo streaming e download di anime da AnimeUnity in italiano"
readme = "README.md"
authors = [
    { name = "ani-it contributors" }
]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
]
keywords = ["anime", "tui", "cli", "streaming", "mpv", "fzf", "animeunity", "archlinux"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]

[project.scripts]
ani-it = "ani_it.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ani_it*"]
exclude = ["tests*"]

[project.urls]
Homepage = "https://github.com/owaismounir206-art/ani-it"
Repository = "https://github.com/owaismounir206-art/ani-it"
Issues = "https://github.com/owaismounir206-art/ani-it/issues"
